name: ledger

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  ledger-net:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  minio-data:
  pgadmin-data:
  redisinsight-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:

# ─── Services ──────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  # Source of truth for all financial data.
  # wal_level=logical is required for Debezium CDC.
  # schema-per-service isolation is enforced by the init SQL.
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
      -c shared_preload_libraries=pg_stat_statements
      -c log_min_duration_statement=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  # Idempotency cache, rate-limit counters, FX quote locks, Redlock.
  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Redpanda ──────────────────────────────────────────────────────────────
  # Kafka-compatible single binary for local dev.
  # Services inside Docker use redpanda:9092.
  # Services on host (tests) use localhost:19092.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: ledger-redpanda
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "9092:9092"      # Kafka API — internal Docker network
      - "19092:19092"    # Kafka API — host access for integration tests
      - "9644:9644"      # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --kafka-addr        internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr         redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp              1
      - --memory           1G
      - --reserve-memory   0M
      - --overprovisioned
      - --node-id          0
      - --check=false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9644/v1/status/ready | grep -q ready"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  # Topic creation — one-shot container after Redpanda is healthy.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: ledger-redpanda-init
    networks: [ledger-net]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/redpanda/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  # ── Redpanda Console ──────────────────────────────────────────────────────
  # Browser UI for inspecting topics, consumer groups, and schemas.
  # http://localhost:8085
  redpanda-console:
    image: redpandadata/console:v2.8.11
    container_name: ledger-redpanda-console
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "8085:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092

  # ── Apicurio Schema Registry ──────────────────────────────────────────────
  # Stores and versions Avro schemas for all Kafka topics.
  # Confluent-compatible API at /apis/ccompat/v6 for franz-go client.
  # http://localhost:8082/ui
  apicurio:
    image: apicurio/apicurio-registry-mem:2.6.3.Final
    container_name: ledger-apicurio
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── MinIO ─────────────────────────────────────────────────────────────────
  # S3-compatible store for NACH/SEPA settlement files and recon reports.
  # S3 API: http://localhost:9000
  # Console UI: http://localhost:9001  (admin / minioadmin)
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ledger-minio
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Bucket creation — one-shot after MinIO is healthy.
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: ledger-minio-init
    networks: [ledger-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    restart: "no"

  # ── Debezium Connect ──────────────────────────────────────────────────────
  # Tails the Postgres WAL via logical replication.
  # Transforms outbox table rows into Kafka messages (transactional outbox pattern).
  # REST API: http://localhost:8083
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: ledger-debezium
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS:       redpanda:9092
      GROUP_ID:                debezium-ledger
      CONFIG_STORAGE_TOPIC:    debezium.configs
      OFFSET_STORAGE_TOPIC:    debezium.offsets
      STATUS_STORAGE_TOPIC:    debezium.status
      # Use plain JSON — Avro via Apicurio is added in Part 4.
      KEY_CONVERTER:                       org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER:                     org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE:      "false"
      CONNECT_KEY_CONVERTER:               org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER:             org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Connector registration — one-shot after Debezium is healthy.
  # Postgres credentials are passed as env vars — never stored in the JSON file.
  debezium-init:
    image: curlimages/curl:8.10.1
    container_name: ledger-debezium-init
    networks: [ledger-net]
    depends_on:
      debezium:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/register-connector.sh"]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - ./infra/debezium:/scripts:ro
    restart: "no"

  # ── pgAdmin 4 ─────────────────────────────────────────────────────────────
  # Browser UI for PostgreSQL — query editor, schema browser, table viewer.
  # http://localhost:5050  (login with PGADMIN_EMAIL / PGADMIN_PASSWORD from .env)
  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: ledger-pgadmin
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # ── RedisInsight ───────────────────────────────────────────────────────────
  # Browser UI for Redis — key browser, query runner, memory analyser.
  # http://localhost:5540  (no login required on first launch)
  redisinsight:
    image: redis/redisinsight:2.44.0
    container_name: ledger-redisinsight
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight-data:/data

  # ── OpenTelemetry Collector ───────────────────────────────────────────────
  # Receives OTLP traces/metrics from all Go services.
  # Forwards traces → Tempo, metrics → Prometheus (via /metrics on 8889).
  # Go services point OTEL_EXPORTER_OTLP_ENDPOINT at localhost:4317.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: ledger-otel-collector
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "4317:4317"   # OTLP gRPC — Go services → collector
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape target (collector re-exports service metrics)
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    command: ["--config=/etc/otel-collector/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy

  # ── Prometheus ────────────────────────────────────────────────────────────
  # Scrapes otel-collector:8889 for Go service metrics.
  # Phase 5+ services expose /metrics and are added to prometheus.yml.
  # http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: ledger-prometheus
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Grafana Tempo ─────────────────────────────────────────────────────────
  # Distributed trace storage. Receives OTLP from otel-collector.
  # Grafana queries traces via HTTP on 3200.
  tempo:
    image: grafana/tempo:2.5.0
    container_name: ledger-tempo
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "3200:3200"   # HTTP API (Grafana datasource)
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Grafana Loki ──────────────────────────────────────────────────────────
  # Log aggregation. Receives structured JSON logs from Promtail.
  # Grafana queries logs via HTTP on 3100.
  loki:
    image: grafana/loki:3.1.1
    container_name: ledger-loki
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Promtail ──────────────────────────────────────────────────────────────
  # Tails Docker container logs and ships them to Loki.
  # Reads zerolog JSON fields (level, message) as Loki labels.
  promtail:
    image: grafana/promtail:3.1.1
    container_name: ledger-promtail
    restart: unless-stopped
    networks: [ledger-net]
    volumes:
      - ./infra/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    depends_on:
      loki:
        condition: service_healthy

  # ── Grafana ───────────────────────────────────────────────────────────────
  # Dashboards wired to Prometheus (metrics), Loki (logs), Tempo (traces).
  # Auto-provisioned datasources from infra/grafana/provisioning/.
  # http://localhost:3000
  grafana:
    image: grafana/grafana:11.1.4
    container_name: ledger-grafana
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Toxiproxy ─────────────────────────────────────────────────────────────
  # Injects latency, dropped packets, and connection resets for chaos tests.
  # Proxies Postgres (15432), Redis (16379), and Redpanda (19093).
  # API: http://localhost:8474
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: ledger-toxiproxy
    restart: unless-stopped
    networks: [ledger-net]
    ports:
      - "8474:8474"    # Toxiproxy HTTP API
      - "15432:15432"  # → postgres:5432
      - "16379:16379"  # → redis:6379
      - "19093:19093"  # → redpanda:9092
    volumes:
      - ./infra/toxiproxy/config.json:/config/toxiproxy.json:ro
    command: ["-config", "/config/toxiproxy.json", "-host", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
