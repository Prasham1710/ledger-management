{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ledger.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/part-of: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: ledger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "{{ $svc.metricsPort }}"
        prometheus.io/path:   "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: {{ include "ledger.image" (dict "name" $name "global" $.Values.global) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: main
              containerPort: {{ $svc.port }}
              protocol: TCP
            {{- if ne (int $svc.metricsPort) (int $svc.port) }}
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: postgres-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: redis-url
            - name: MINIO_ENDPOINT
              value: {{ $.Values.global.minio.endpoint | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: minio-secret-key
            - name: MINIO_USE_SSL
              value: {{ $.Values.global.minio.useSSL | quote }}
            - name: KAFKA_BROKERS
              value: {{ $.Values.global.kafka.brokers | quote }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu:    {{ $svc.resources.requests.cpu }}
              memory: {{ $svc.resources.requests.memory }}
            limits:
              cpu:    {{ $svc.resources.limits.cpu }}
              memory: {{ $svc.resources.limits.memory }}
{{- end }}
{{- end }}
