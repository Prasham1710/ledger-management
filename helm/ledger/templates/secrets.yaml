apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-url:    {{ .Values.global.postgres.url | quote }}
  redis-url:       {{ .Values.global.redis.url | quote }}
  minio-access-key: {{ .Values.global.minio.accessKey | quote }}
  minio-secret-key: {{ .Values.global.minio.secretKey | quote }}
