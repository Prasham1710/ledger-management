{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ledger.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: ledger
  ports:
    - name: main
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
    {{- if ne (int $svc.metricsPort) (int $svc.port) }}
    - name: metrics
      port: {{ $svc.metricsPort }}
      targetPort: {{ $svc.metricsPort }}
      protocol: TCP
    {{- end }}
  type: ClusterIP
{{- end }}
{{- end }}
