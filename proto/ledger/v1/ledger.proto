syntax = "proto3";

package ledger.v1;

import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/prasham/ledger/gen/ledger/v1;ledgerv1";

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_DEBIT       = 1;
  ENTRY_TYPE_CREDIT      = 2;
}

// Entry is one side of a double-entry pair.
// Balances are never stored — they are projected by summing entries.
message Entry {
  string                    id           = 1;
  string                    account_id   = 2;
  EntryType                 type         = 3;
  common.v1.Money           amount       = 4;
  string                    reference_id = 5; // transaction_id or payout_id
  string                    description  = 6;
  google.protobuf.Timestamp created_at   = 7;
}

// PostEntryRequest carries a balanced double-entry pair.
// debit_account_id and credit_account_id must differ.
message PostEntryRequest {
  string          idempotency_key   = 1;
  string          debit_account_id  = 2;
  string          credit_account_id = 3;
  common.v1.Money amount            = 4;
  string          reference_id      = 5;
  string          description       = 6;
}

message PostEntryResponse {
  Entry debit_entry  = 1;
  Entry credit_entry = 2;
}

// ReverseEntryRequest asks the ledger to neutralise a previously posted pair.
//
// The ledger is append-only: reversal posts a mirror-image debit/credit pair
// referencing the same reference_id, it never deletes or mutates rows. Posting
// a reversal twice for the same reference_id is rejected, so a saga may safely
// retry its compensating action.
message ReverseEntryRequest {
  string idempotency_key = 1;
  // reference_id identifies the original entry pair (transaction or payout id).
  string reference_id = 2;
  // reason is recorded in the reversal entries' description for audit.
  string reason = 3;
}

message ReverseEntryResponse {
  // The mirror-image pair that neutralises the original.
  Entry debit_entry  = 1;
  Entry credit_entry = 2;
}

message GetBalanceRequest {
  string account_id = 1;
  // currency scopes the projection. An account's entries are constrained to a
  // single currency, so this is optional; when set it is verified against the
  // stored entries and a mismatch is an error.
  string currency = 2;
}

message GetBalanceResponse {
  string          account_id = 1;
  common.v1.Money balance    = 2;
}

message ListEntriesRequest {
  string account_id  = 1;
  int32  page_size   = 2;
  string page_token  = 3;
}

message ListEntriesResponse {
  repeated Entry entries         = 1;
  string         next_page_token = 2;
}

service LedgerService {
  rpc PostEntry    (PostEntryRequest)    returns (PostEntryResponse);
  // ReverseEntry posts a compensating mirror pair for an existing reference_id.
  // Sagas call this to undo a ledger write when a later step fails.
  rpc ReverseEntry (ReverseEntryRequest) returns (ReverseEntryResponse);
  rpc GetBalance   (GetBalanceRequest)   returns (GetBalanceResponse);
  rpc ListEntries  (ListEntriesRequest)  returns (ListEntriesResponse);
}
